name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A project site is served from /<repo>/, a user or custom-domain site
      # from the root. Work out which this is so asset paths come out right.
      - name: Work out the base path
        id: base
        run: |
          if [ -f public/CNAME ] || [[ "${{ github.repository }}" == *".github.io" ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      # These two are deliberately public: with no server, the browser posts to
      # Apps Script itself, so both values ship inside the page and anyone who
      # views source can read them. They are NOT secrets and must not be put in
      # Actions secrets, which would only hide them from you. What guards the
      # spreadsheet is MAX_PER_HOUR in tools/sheet-webhook.gs.
      - name: Build the static site
        env:
          NEXT_PUBLIC_SHEET_URL: https://script.google.com/macros/s/AKfycbxGeM_cfinzTauq7smWdOY-ruVhn_Ao3GVAfFOLOcws4D1fQHoyfjrH56JDLsmwG2Wthg/exec
          NEXT_PUBLIC_SHEET_KEY: szpk_jCMrkhtmzqLb-ROl
        run: node scripts/export.mjs --base "${{ steps.base.outputs.path }}"

      - name: Refuse to ship a build that cannot reach the sheet
        run: |
          if ! grep -rq '/macros/s/' out/_next/static/chunks; then
            echo "::error::The booking form would fall back to LINE. The sheet keys did not reach the build."
            exit 1
          fi
          echo "Bookings will post to the spreadsheet."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
