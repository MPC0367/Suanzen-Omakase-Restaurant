name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A project site is served from /<repo>/, a user or custom-domain site
      # from the root. Work out which this is, and the address it lives at, so
      # asset paths and the link preview come out right. public/CNAME is the
      # one switch: put the domain in it and both follow.
      - name: Work out where the site lives
        id: base
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ -f public/CNAME ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "origin=https://$(tr -d '[:space:]' < public/CNAME)" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.repository }}" == *".github.io" ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "origin=https://$owner.github.io" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
            echo "origin=https://$owner.github.io" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the static site
        env:
          # Where canonical, hreflang, og:url and og:image point.
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.base.outputs.origin }}
        run: node scripts/export.mjs --base "${{ steps.base.outputs.path }}"


      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
